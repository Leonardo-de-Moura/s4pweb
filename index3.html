<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="styles/styles.css">
	<script defer src="scripts/modals.js"></script>
	
</head>

<body>
	<header>
		<h1>s4blog</h1>


		<p>bem-vindo, <span>joão silva</span></p>

	</header>
	<main>

		<section class="section-artigos">
			<div class="artigos-cabecalho">
				<h2>minhas publicaçoes</h2>
				<div class="artigos-busca">

					<button class="botao-busca">
						<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M5.3335 8H10.6668" stroke="white" stroke-width="1.5" stroke-linecap="round"
								stroke-linejoin="round" />
							<path d="M8 10.6667V5.33333" stroke="white" stroke-width="1.5" stroke-linecap="round"
								stroke-linejoin="round" />
							<path
								d="M6.00016 14.6667H10.0002C13.3335 14.6667 14.6668 13.3333 14.6668 10V6C14.6668 2.66666 13.3335 1.33333 10.0002 1.33333H6.00016C2.66683 1.33333 1.3335 2.66666 1.3335 6V10C1.3335 13.3333 2.66683 14.6667 6.00016 14.6667Z"
								stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
						</svg>
						novo post
					</button>
				</div>
			</div>

			<div class="artigos-grid">





			</div>
			</div>
			</div>
			</div>

			<button class="botao-carregar-mais">Carregar mais</button>
		</section>
	</main>



	<!-- Modal Criar -->
	<div id="modalCriar" class="modal">
		<h2>Criar postagem</h2>
		<input type="text" placeholder="Informe o nome">
		<input type="text" placeholder="Informe o título">
		<input type="text" placeholder="Informe a categoria">
		<input type="text" placeholder="Informe a URL de capa">
		<textarea rows="4" placeholder="Digite o conteúdo"></textarea>
		<button>Salvar</button>
	</div>

	<!-- Modal Editar -->
	<div id="modalEditar" class="modal">
		<h2>Editar postagem</h2>
		<input type="text" value="Helena Souza">
		<input type="text" value="Criando front-end com React JS">
		<input type="text" value="Tecnologia">
		<input type="text" value="https://exemplo.com.br/imagem.jpg">
		<textarea rows="4">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</textarea>
		<button>Salvar</button>
	</div>

	<!-- Modal Excluir -->
	<div id="modalExcluir" class="modal">
		<h2>Excluir postagem</h2>
		<p>Tem certeza que deseja excluir esta postagem? Ao clicar em sim o processo não pode ser desfeito.</p>
		<button class="btn-excluir">Excluir</button>
		<button class="btn-cancelar">Cancelar</button>
	</div>



</body>

</html>
