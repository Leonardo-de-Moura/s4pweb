<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modais Separados</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
  }

  /* Estilo comum dos modais */
  .modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    padding: 20px;
    width: 320px;
    z-index: 1000;
  }

  .modal h2 {
    margin-top: 0;
    font-size: 20px;
  }

  .modal input, .modal textarea {
    width: 100%;
    padding: 8px;
    margin: 6px 0 12px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .modal textarea {
    resize: none;
  }

  .modal button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
  }

  /* Modal criar */
  #modalCriar {
    border-top: 4px solid #6c63ff;
  }
  #modalCriar button {
    background-color: #6c63ff;
    color: white;
  }

  /* Modal editar */
  #modalEditar {
    border-top: 4px solid #4caf50;
  }
  #modalEditar button {
    background-color: #4caf50;
    color: white;
  }

  /* Modal excluir */
  #modalExcluir {
    border-top: 4px solid #f44336;
    text-align: center;
  }
  #modalExcluir button {
    margin: 5px 0;
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
  }
  #modalExcluir .btn-excluir {
    background-color: #f44336;
    color: white;
  }
  #modalExcluir .btn-cancelar {
    background-color: #6c63ff;
    color: white;
  }
</style>
</head>
<body>

<!-- Modal Criar -->
<div id="modalCriar" class="modal">
  <h2>Criar postagem</h2>
  <input type="text" placeholder="Informe o nome">
  <input type="text" placeholder="Informe o título">
  <input type="text" placeholder="Informe a categoria">
  <input type="text" placeholder="Informe a URL de capa">
  <textarea rows="4" placeholder="Digite o conteúdo"></textarea>
  <button>Salvar</button>
</div>

<!-- Modal Editar -->
<div id="modalEditar" class="modal">
  <h2>Editar postagem</h2>
  <input type="text" value="Helena Souza">
  <input type="text" value="Criando front-end com React JS">
  <input type="text" value="Tecnologia">
  <input type="text" value="https://exemplo.com.br/imagem.jpg">
  <textarea rows="4">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</textarea>
  <button>Salvar</button>
</div>

<!-- Modal Excluir -->
<div id="modalExcluir" class="modal">
  <h2>Excluir postagem</h2>
  <p>Tem certeza que deseja excluir esta postagem? Ao clicar em sim o processo não pode ser desfeito.</p>
  <button class="btn-excluir">Excluir</button>
  <button class="btn-cancelar">Cancelar</button>
</div>

<script>
  // Função simples para abrir modais (exemplo)
  function abrirModal(id) {
    document.getElementById(id).style.display = 'block';
  }
</script>

</body>
</html>
